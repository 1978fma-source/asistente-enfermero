<script>
  const ecgState = {
    fc: null,
    ritmo: null,
    qrs: null,
    ondap: null,
    st: null,
    estado: null
  };

  let attachedImgData = null;
  let recognition = null;
  let isListening = false;

  const GUÍAS_FIJAS = {
    torax: {
      titulo: "Dolor torácico agudo",
      inmediato: "Monitorización ECG, TA, FC y SatO2; acceso venoso periférico; reposo y valoración de constantes.",
      cuidados: "ECG de 12 derivaciones lo antes posible (en <10 min) y revisión de signos de alarma/inestabilidad.",
      farmacos: "Oxigenoterapia solo si SatO2 <90% (o según protocolo local); analgesia/antiagregación según indicación médica y protocolo.",
      alertas: "Signos de inestabilidad hemodinámica, disnea grave, síncope, arritmias o elevación del ST."
    },
    sepsis: {
      titulo: "Código Sepsis · Criterios y actuación inicial",
      inmediato: "Valoración ABCDE, toma de constantes completas, glucemia capilar y canalización de vía venosa.",
      cuidados: "Extracción de analítica/cultivos según protocolo antes o sin demorar el inicio terapéutico indicado; control de diuresis y balance.",
      farmacos: "Fluidoterapia y antibioterapia empírica según prescripción médica y protocolo del centro.",
      alertas: "Hipotensión mantenida, lactato elevado, oliguria, alteración del nivel de conciencia o taquipnea marcada."
    },
    rcp: {
      titulo: "PCR adulto · Algoritmo SVB / SVA",
      inmediato: "Comprobar respuesta y respiración normal; activar equipo/emergencias y solicitar desfibrilador (DESA/monitor).",
      cuidados: "Compresiones torácicas de alta calidad (100-120/min, profundidad ~5-6 cm, mínima interrupción) y ventilaciones según disponibilidad/equipo.",
      farmacos: "Adrenalina y antiarrítmicos según ritmo desfibrilable/no desfibrilable y pauta de soporte vital avanzado.",
      alertas: "Análisis de ritmo temprano, cambio de reanimador cada 2 min para evitar fatiga y búsqueda de causas reversibles (4H / 4T)."
    },
    anafilaxia: {
      titulo: "Shock anafiláctico · Manejo y dosis",
      inmediato: "Retirar desencadenante si es visible, colocar al paciente en decúbito supino (o semiincorporado si disnea grave) y monitorizar.",
      cuidados: "Vía aérea permeable, oxígeno de alto flujo si precisa y dos accesos venosos si hay signos de shock.",
      farmacos: "Adrenalina intramuscular (cara anterolateral del muslo) según protocolo/dosis pautada; apoyo con fluidos y fármacos coadyuvantes según indicación.",
      alertas: "Estridor, broncoespasmo severo, hipotensión refractaria o riesgo de reacción bifásica."
    },
    general: {
      titulo: "Consulta rápida · Modo local sin IA",
      inmediato: "Esta estación funciona en modo local fijo (sin API externa). Revisa constantes, valoración inicial y paneles de ECG o Vademécum Pediátrico.",
      cuidados: "Usa los accesos rápidos de Dolor torácico, Código Sepsis, PCR / RCP o Anafilaxia para ver puntos clave estructurados.",
      farmacos: "Consulta siempre las dosis, diluciones y protocolos vigentes de tu unidad o prescripción médica.",
      alertas: "Reevaluar cambios bruscos en constantes, dolor, nivel de conciencia o perfusión."
    }
  };

  function setStatus(mode) {
    const dot = document.getElementById('sdot');
    if (!dot) return;
    dot.className = 'sdot ' + mode;
  }

  function saveKey() {
    const banner = document.getElementById('key-banner');
    if (banner) banner.classList.add('hidden');
    setStatus('dok');
  }

  function changeKey() {
    const banner = document.getElementById('key-banner');
    if (banner) banner.classList.remove('hidden');
  }

  function clearScreen() {
    const msgs = document.getElementById('msgs');
    if (!msgs) return;
    msgs.innerHTML = `
      <div class="welcome" id="welcome">
        <div style="font-size:32px;margin-bottom:10px">🚑</div>
        <strong>Estación Clínica de Guardia</strong>
        <em>Desarrollado por Fernando · Modo Local Rápido</em>
        <p>Selecciona un caso rápido o usa los paneles de ECG y Vademécum Pediátrico.</p>
        <div class="chips">
          <div class="chip" onclick="chip('Paciente con dolor torácico agudo')">Dolor torácico</div>
          <div class="chip" onclick="chip('Código Sepsis criterios de actuación')">Código Sepsis</div>
          <div class="chip" onclick="chip('PCR adulto algoritmo de actuación SVB SVA')">PCR / RCP</div>
          <div class="chip" onclick="chip('Shock anafiláctico manejo y dosis')">Anafilaxia</div>
        </div>
      </div>
    `;
  }

  function chip(text) {
    const inp = document.getElementById('inp');
    if (inp) inp.value = text;
    doSend();
  }

  function togglePanel(which) {
    const ecg = document.getElementById('ecg-panel');
    const vade = document.getElementById('vade-panel');
    if (which === 'ecg') {
      ecg.classList.toggle('show');
      vade.classList.remove('show');
    } else if (which === 'vade') {
      vade.classList.toggle('show');
      ecg.classList.remove('show');
    }
  }

  function setEcg(btn) {
    const param = btn.getAttribute('data-param');
    const val = btn.getAttribute('data-val');
    document.querySelectorAll(`.ecg-opt[data-param="${param}"]`).forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    ecgState[param] = val;
    renderEcgSummary();
  }

  function renderEcgSummary() {
    const box = document.getElementById('ecg-res-box');
    if (!box) return;

    const partes = [];
    if (ecgState.fc) partes.push(`FC: ${ecgState.fc}`);
    if (ecgState.ritmo) partes.push(`Ritmo: ${ecgState.ritmo}`);
    if (ecgState.qrs) partes.push(`QRS: ${ecgState.qrs}`);
    if (ecgState.ondap) partes.push(`Onda P: ${ecgState.ondap}`);
    if (ecgState.st) partes.push(`ST: ${ecgState.st}`);
    if (ecgState.estado) partes.push(`Estado: ${ecgState.estado}`);

    if (!partes.length) {
      box.textContent = 'Selecciona los parámetros del ECG para obtener interpretación...';
      return;
    }

    let alerta = 'Revisión sistemática de frecuencia, ritmo, eje/QRS, onda P y segmento ST.';
    if (ecgState.estado === 'inestable' || ecgState.st === 'elev') {
      alerta = 'PRIORIDAD ALTA: Valorar estabilidad clínica, monitorización continua y activación de protocolo/aviso médico inmediato.';
    }

    box.textContent = `Parámetros: ${partes.join(' · ')}\n\nOrientación: ${alerta}`;
  }

  function previewEcgImg(input) {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      attachedImgData = e.target.result;
      const img = document.getElementById('img-preview');
      const box = document.getElementById('img-preview-box');
      if (img && box) {
        img.src = attachedImgData;
        box.style.display = 'block';
      }
    };
    reader.readAsDataURL(file);
  }

  function clearAttachedImg() {
    attachedImgData = null;
    const fileInput = document.getElementById('ecg-img-file');
    const img = document.getElementById('img-preview');
    const box = document.getElementById('img-preview-box');
    if (fileInput) fileInput.value = '';
    if (img) img.src = '';
    if (box) box.style.display = 'none';
  }

  function resetEcgPanel() {
    Object.keys(ecgState).forEach(k => { ecgState[k] = null; });
    document.querySelectorAll('.ecg-opt').forEach(b => b.classList.remove('active'));
    clearAttachedImg();
    renderEcgSummary();
  }

  function sendEcgToAi() {
    const boxText = document.getElementById('ecg-res-box')?.textContent || 'ECG seleccionado';
    togglePanel('ecg');
    appendUserMessage(boxText, attachedImgData);
    appendBotGuide(GUÍAS_FIJAS.torax);
  }

  function buscarGuiaLocal(texto) {
    const t = (texto || '').toLowerCase();
    if (t.includes('torác') || t.includes('torac') || t.includes('pecho') || t.includes('ecg')) return GUÍAS_FIJAS.torax;
    if (t.includes('sepsis')) return GUÍAS_FIJAS.sepsis;
    if (t.includes('pcr') || t.includes('rcp') || t.includes('paro')) return GUÍAS_FIJAS.rcp;
    if (t.includes('anafil') || t.includes('shock')) return GUÍAS_FIJAS.anafilaxia;
    return {
      ...GUÍAS_FIJAS.general,
      titulo: `Consulta: ${texto || 'Registro rápido'}`
    };
  }

  function appendUserMessage(text, imgSrc) {
    const welcome = document.getElementById('welcome');
    if (welcome) welcome.remove();

    const msgs = document.getElementById('msgs');
    const div = document.createElement('div');
    div.className = 'buser';
    div.textContent = text;
    if (imgSrc) {
      const img = document.createElement('img');
      img.src = imgSrc;
      div.appendChild(img);
    }
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function appendBotGuide(g) {
    const msgs = document.getElementById('msgs');
    const bot = document.createElement('div');
    bot.className = 'bbot';
    bot.innerHTML = `
      <div class="sec s1"><div class="slbl">1. Actuación inmediata <span class="ssub">${g.titulo}</span></div><div class="stxt">${g.inmediato}</div></div>
      <div class="sec s2"><div class="slbl">2. Cuidados y monitorización</div><div class="stxt">${g.cuidados}</div></div>
      <div class="sec s3"><div class="slbl">3. Fármacos y soporte</div><div class="stxt">${g.farmacos}</div></div>
      <div class="sec s4"><div class="slbl">4. Signos de alarma</div><div class="stxt">${g.alertas}</div></div>
    `;
    msgs.appendChild(bot);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function doSend() {
    const inp = document.getElementById('inp');
    if (!inp) return;
    const text = inp.value.trim();
    if (!text && !attachedImgData) return;

    appendUserMessage(text || 'Adjunto de imagen clínico', attachedImgData);
    inp.value = '';
    inp.style.height = '24px';
    clearAttachedImg();
    appendBotGuide(buscarGuiaLocal(text));
  }

  function calcPed(val) {
    const kg = parseFloat(val);
    document.querySelectorAll('.calc-val').forEach(el => {
      const unit = el.getAttribute('data-unit') || '';
      if (!kg || kg <= 0) {
        el.textContent = '—';
        return;
      }
      const mult = parseFloat(el.getAttribute('data-mult') || '0');
      const minV = el.getAttribute('data-min') ? parseFloat(el.getAttribute('data-min')) : null;
      const maxV = el.getAttribute('data-max') ? parseFloat(el.getAttribute('data-max')) : null;

      let res = kg * mult;
      if (minV !== null && res < minV) res = minV;
      if (maxV !== null && res > maxV) res = maxV;

      const formatted = Number.isInteger(res) ? res : res.toFixed(2).replace(/\.?0+$/, '');
      el.textContent = `${formatted} ${unit}`.trim();
    });
  }

  function filterPed(q) {
    const term = (q || '').toLowerCase().trim();
    const cards = document.querySelectorAll('#vade-list .p-card');
    const advTitle = document.getElementById('adv-title');

    if (advTitle) {
      advTitle.classList.toggle('hidden-card', !term);
    }

    cards.forEach(card => {
      const line = card.getAttribute('data-line');
      const name = (card.getAttribute('data-name') || '').toLowerCase();
      const text = card.textContent.toLowerCase();
      if (!term) {
        card.classList.toggle('hidden-card', line === 'second');
      } else {
        const match = name.includes(term) || text.includes(term);
        card.classList.toggle('hidden-card', !match);
      }
    });
  }

  function toggleVoice() {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    const btn = document.getElementById('mic-btn');
    const inp = document.getElementById('inp');
    if (!SpeechRec || !btn || !inp) return;

    if (isListening && recognition) {
      recognition.stop();
      isListening = false;
      btn.classList.remove('listening');
      return;
    }

    recognition = new SpeechRec();
    recognition.lang = 'es-ES';
    recognition.interimResults = false;

    recognition.onresult = function(e) {
      const transcript = e.results[0][0].transcript || '';
      inp.value = inp.value ? `${inp.value} ${transcript}` : transcript;
    };

    recognition.onend = function() {
      isListening = false;
      btn.classList.remove('listening');
    };

    isListening = true;
    btn.classList.add('listening');
    recognition.start();
  }

  window.addEventListener('DOMContentLoaded', () => {
    const banner = document.getElementById('key-banner');
    const keySet = document.getElementById('key-set');
    if (banner) banner.classList.add('hidden');
    if (keySet) keySet.style.display = 'none';
    setStatus('dok');

    const inp = document.getElementById('inp');
    if (inp) {
      inp.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          doSend();
        }
      });
    }
  });
</script>
</body>
</html>
